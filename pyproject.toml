[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "helixcode"
version = "0.1.0"
description = "AI Software Engineering Agent — analyze, understand, modify, test, and commit code in local repositories via CLI."
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "HelixCode Contributors" }]
readme = "README.md"
keywords = ["ai", "agent", "cli", "code-review", "software-engineering"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
    "Environment :: Console",
]

dependencies = [
    "typer>=0.15",
    "langgraph>=0.4",
    "openai>=1.60",
    "mcp>=1.0",
    "tree-sitter>=0.22",
    "qdrant-client>=1.12",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "gitpython>=3.1",
    "loguru>=0.7",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
helix = "helixcode.cli.main:app"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "single"

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = ["-v", "--tb=short"]
